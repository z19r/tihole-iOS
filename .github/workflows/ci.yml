name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package tests
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # PiholeKit and TiholeCore are plain Swift packages, so their tests run
      # on the macOS host with no simulator.
      - name: Test
        run: swift test --package-path Packages/TiholeKit

  swift-format:
    name: Swift format
    runs-on: ubuntu-latest
    # The same image `just fmt-check` runs, so local and CI output match.
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7

      # 80 columns, see .swift-format.
      - name: Format and lint
        run: >-
          swift-format lint --strict --recursive --parallel
          Tihole TiholeUITests Packages

  scripts:
    name: Python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 80-column ruff format and lint, the same as `just fmt-check`.
      - name: Format and lint
        run: |
          pipx run ruff format --check scripts
          pipx run ruff check scripts

  app:
    name: Build app
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project Tihole.xcodeproj \
            -scheme Tihole \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  ui:
    name: UI smoke test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Drives the app through onboarding and every tab against a mock
      # Pi-hole that runs inside the test runner.
      - name: Test on the newest iPhone simulator
        run: |
          udid="$(scripts/pick_simulator.py)"
          echo "Using simulator $udid"
          # Boot it first, so the test runner does not time out waiting for
          # accessibility while the simulator is still starting.
          xcrun simctl bootstatus "$udid" -b
          xcodebuild test \
            -project Tihole.xcodeproj \
            -scheme Tihole \
            -destination "platform=iOS Simulator,id=$udid" \
            -resultBundlePath TestResults.xcresult

      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path TestResults.xcresult \
            --output-path screenshots || true
          ls -la screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
