name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # PiholeKit and TiholeCore are plain Swift packages, so their tests run
      # on the macOS host with no simulator.
      - name: Test
        run: swift test --package-path Packages/TiholeKit

  app:
    name: Build app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project Tihole.xcodeproj \
            -scheme Tihole \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

  ui:
    name: UI smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Drives the app through onboarding and every tab against a mock
      # Pi-hole that runs inside the test runner.
      - name: Test on the newest iPhone simulator
        run: |
          udid="$(scripts/pick_simulator.py)"
          echo "Using simulator $udid"
          xcodebuild test \
            -project Tihole.xcodeproj \
            -scheme Tihole \
            -destination "platform=iOS Simulator,id=$udid" \
            -resultBundlePath TestResults.xcresult

      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments \
            --path TestResults.xcresult \
            --output-path screenshots || true
          ls -la screenshots || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: ignore
