name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      # PiholeKit and TiholeCore are plain Swift packages, so their tests run
      # on the macOS host with no simulator.
      - name: Test
        run: swift test --package-path Packages/TiholeKit

  app:
    name: Build app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build for the iOS Simulator
        run: |
          xcodebuild build \
            -project Tihole.xcodeproj \
            -scheme Tihole \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
