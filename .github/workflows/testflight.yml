name: TestFlight

# Archives the app on a macOS runner and uploads it to App Store Connect,
# where it appears in TestFlight once Apple finishes processing it. No Mac
# needed: run it from the Actions tab, or push a tag like v0.1.0.
#
# One-time setup:
#   1. Create an App Store Connect API key with the Admin role (Users and
#      Access, Integrations). Admin is what lets Xcode use a cloud-managed
#      distribution certificate, so no certificate has to be stored here.
#   2. Add these repository secrets:
#        ASC_KEY_ID        the key's id
#        ASC_ISSUER_ID     the issuer id shown above the key list
#        ASC_PRIVATE_KEY   the contents of the downloaded .p8 file
#   3. Create the app in App Store Connect with the bundle id
#      com.z19r.tihole. Apple's API cannot do this part. The first run
#      registers the bundle id, so run once, create the app, and run again.
#
# APPLE_TEAM_ID is optional. Without it the team id is read from the bundle
# id's prefix.
#
# Pull requests that touch this file run the archive step only, to prove the
# release build still compiles. They never see the secrets.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/testflight.yml
      - scripts/asc_prepare.py
      - project.yml

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: Archive and upload
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Build provenance: sign the uploaded .ipa with this run's identity.
      id-token: write
      attestations: write
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Check secrets
        if: github.event_name != 'pull_request'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository secret $name is not set"
              missing=1
            fi
          done
          exit "$missing"

      - name: Install the App Store Connect API key
        if: github.event_name != 'pull_request'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          key="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # Accept the .p8 pasted as text, or base64-encoded.
          if printf '%s' "$ASC_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          else
            printf '%s' "$ASC_PRIVATE_KEY" | base64 --decode > "$key"
          fi
          chmod 600 "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      # Registers the bundle id if needed, resolves TEAM_ID, and stops early
      # with instructions if the app record does not exist yet.
      - name: Prepare App Store Connect
        if: github.event_name != 'pull_request'
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pyjwt[crypto]'
          "$RUNNER_TEMP/venv/bin/python" scripts/asc_prepare.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # The build number is the run number, so every upload is newer than the
      # last. A v1.2.3 tag also sets the version; otherwise project.yml's is
      # used.
      - name: Archive
        run: |
          version_args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version_args+=("MARKETING_VERSION=${GITHUB_REF_NAME#v}")
          fi
          # Unsigned here; the export step signs with the distribution
          # certificate. Signing the archive would mint a new development
          # certificate on every run.
          xcodebuild archive \
            -project Tihole.xcodeproj \
            -scheme Tihole \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Tihole.xcarchive" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            DEVELOPMENT_TEAM="${TEAM_ID:-}" \
            CODE_SIGNING_ALLOWED=NO \
            "${version_args[@]}"

      # Export the signed .ipa to disk instead of uploading straight from
      # xcodebuild, so the exact file Apple receives can be attested.
      - name: Sign the app
        if: github.event_name != 'pull_request'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Tihole.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          ipa="$(ls "$RUNNER_TEMP"/export/*.ipa)"
          echo "IPA=$ipa" >> "$GITHUB_ENV"

      # Verify with: gh attestation verify Tihole.ipa --repo z19r/tihole-iOS
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ env.IPA }}

      # The attested .ipa, so anyone can download and verify it.
      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: Tihole-ipa
          path: ${{ env.IPA }}

      - name: Upload to App Store Connect
        if: github.event_name != 'pull_request'
        env:
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/keys
        run: |
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove the API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
