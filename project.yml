# XcodeGen spec. `xcodegen generate` (or `just gen`) turns this into
# Tihole.xcodeproj, which is not checked in.
name: Tihole

options:
  bundleIdPrefix: com.z19r
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  TiholeKit:
    path: Packages/TiholeKit

targets:
  Tihole:
    type: application
    platform: iOS
    sources:
      - path: Tihole
    dependencies:
      - package: TiholeKit
        product: PiholeKit
      - package: TiholeKit
        product: TiholeCore
    info:
      path: Tihole/Info.plist
      properties:
        CFBundleDisplayName: tihole
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        # Pi-holes are reached by whatever address the person types: plain
        # http, bare IPs, .lan names, Tailscale names. App Transport Security
        # cannot enumerate those, so arbitrary loads are allowed. The only
        # hosts the app ever contacts are the instances the person configures.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: tihole connects to the Pi-hole on your network to show its status and manage its settings.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.z19r.tihole
        PRODUCT_NAME: Tihole
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES

schemes:
  Tihole:
    build:
      targets:
        Tihole: all
    run:
      config: Debug
    archive:
      config: Release
